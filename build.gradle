plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

// Pick the Minecraft version with -Pmc=<version>, e.g. gradlew build -Pmc=26.3
// (settings in versions/<version>.properties). Without it, gradle.properties decides.
if (project.hasProperty('mc')) {
    def file = rootProject.file("versions/${project.mc}.properties")
    if (!file.exists()) throw new GradleException("No versions/${project.mc}.properties")
    def props = new Properties()
    file.withInputStream { props.load(it) }
    props.each { key, value -> project.ext.set(key, value) }
}

group = project.maven_group
version = "${project.mod_version}+${project.minecraft_version}"

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()
}

// The few calls that differ between Minecraft versions live in src/compat/<compat_dir>.
sourceSets.client.java.srcDir "src/compat/${project.compat_dir}/java"

repositories {
    maven {
        url = "https://maven.starred.foo/releases"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation "foo.starred:cascade:${cascade_version}"
    include "foo.starred:cascade:${cascade_version}"
    // required at runtime by Cascade
    implementation "net.fabricmc:fabric-language-kotlin:${fabric_kotlin_version}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_dependency', project.minecraft_dependency
    filesMatching('fabric.mod.json') {
        expand 'version': project.version, 'minecraft_dependency': project.minecraft_dependency
    }
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.archives_base_name}" }
    }
    // Cascade is bundled, and its BSD-3 license requires shipping its notice with it
    from('THIRD_PARTY_NOTICES.md')
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
    }
}
